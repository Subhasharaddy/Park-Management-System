{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="page"><div class="container"><div class="auth-wrap">
  <div class="center mb"><h1 class="page-title">Welcome <span class="grad">back</span></h1><p class="muted">Log in to continue to ParkCare 3D.</p></div>
  <div class="card">
    <div class="tabs">
      <a href="{{ url_for('auth.login', role='citizen') }}" class="{{ 'on' if role=='citizen' }}"><i class="fa-solid fa-user"></i> Citizen</a>
      <a href="{{ url_for('auth.login', role='staff') }}" class="{{ 'on' if role=='staff' }}"><i class="fa-solid fa-helmet-safety"></i> Staff</a>
      <a href="{{ url_for('auth.login', role='admin') }}" class="{{ 'on' if role=='admin' }}"><i class="fa-solid fa-shield-halved"></i> Admin</a>
    </div>
    <form method="post" action="{{ url_for('auth.login') }}" novalidate data-validate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="role" value="{{ role }}">
      <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
      <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="btn btn-primary btn-block mt" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Log in as {{ role|capitalize }}</button>
    </form>
    {% if role == 'citizen' %}<p class="center muted small mt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>{% endif %}
  </div></div></div></section>{% endblock %}
