{% macro badge(status) %}<span class="badge st-{{ status|slug }}">{{ status }}</span>{% endmacro %}
{% macro pager(page, pages, endpoint, args={}) %}
{% if pages > 1 %}<div class="pager">
  {% for p in range(1, pages + 1) %}
    {% if p == page %}<span class="cur">{{ p }}</span>
    {% else %}<a href="{{ url_for(endpoint, page=p, **args) }}">{{ p }}</a>{% endif %}
  {% endfor %}</div>{% endif %}
{% endmacro %}
