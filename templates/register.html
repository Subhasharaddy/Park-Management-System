{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<section class="page"><div class="container"><div class="auth-wrap">
  <div class="center mb"><h1 class="page-title">Join <span class="grad">ParkCare</span></h1><p class="muted">Create a citizen account to report and track park issues.</p></div>
  <div class="card"><form method="post" novalidate data-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label><input id="full_name" name="full_name" required minlength="2" maxlength="100" value="{{ form.get('full_name','') }}">
    <label for="email">Email</label><input id="email" name="email" type="email" required value="{{ form.get('email','') }}">
    <label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" maxlength="20" value="{{ form.get('phone','') }}">
    <div class="form-row"><div><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <div><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"></div></div>
    <p class="hint">At least 8 characters with letters and digits.</p>
    <button class="btn btn-primary btn-block mt" type="submit"><i class="fa-solid fa-user-plus"></i> Create account</button>
  </form><p class="center muted small mt">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>
</div></div></section>{% endblock %}
