# Optional: run MySQL in Docker instead of installing it.   docker compose up -d
services:
  db:
    image: mysql:8.0
    container_name: parkcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your shell or .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parkcare_db}
      MYSQL_USER: ${MYSQL_USER:-parkcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in your shell or .env}
    ports: ["3306:3306"]
    volumes: ["parkcare_data:/var/lib/mysql"]
volumes:
  parkcare_data:
